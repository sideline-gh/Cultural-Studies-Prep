<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT & Cultural Studies Flashcards</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        p.subtitle {
            color: #6b7280;
            margin-top: 0;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background-color: #e5e7eb;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 600px;
            height: 320px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #eef2ff;
            color: #312e81;
        }

        .category-tag {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .card-number {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--primary-hover);
        }

        .nav-btn:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }

        #counter {
            font-weight: 600;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <header>
        <h1>ICT & Cultural Studies Flashcards</h1>
        <p class="subtitle">Click the card to flip between Question and Answer</p>
    </header>

    <div class="filters" id="filters">
        <button class="filter-btn active" onclick="filterCategory('All')">All (55)</button>
        <button class="filter-btn" onclick="filterCategory('Cultural Studies')">Cultural Studies</button>
        <button class="filter-btn" onclick="filterCategory('ICT - Internet')">Internet & Web</button>
        <button class="filter-btn" onclick="filterCategory('ICT - Cloud')">Cloud Computing</button>
        <button class="filter-btn" onclick="filterCategory('ICT - Databases')">Databases</button>
        <button class="filter-btn" onclick="filterCategory('ICT - Security')">Cybersecurity</button>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <span class="category-tag" id="front-category">Category</span>
                <span class="card-number" id="front-number">1 / 55</span>
                <h2 id="front-text">Question goes here</h2>
                <span class="hint">Click to flip</span>
            </div>
            <div class="card-face card-back">
                <span class="category-tag" id="back-category">Category</span>
                <span class="card-number" id="back-number">1 / 55</span>
                <p id="back-text" style="font-size: 1.1rem; line-height: 1.5;">Answer goes here</p>
                <span class="hint">Click to flip back</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prev-btn" onclick="prevCard()">Previous</button>
        <span id="counter">1 / 55</span>
        <button class="nav-btn" id="next-btn" onclick="nextCard()">Next</button>
    </div>

    <script>
        const flashcards = [
            // Cultural Studies (10)
            { question: "Modern Kazakhstani painter who uses plastic bags to create paintings", answer: "Saule Suleimenova", category: "Cultural Studies" },
            { question: "The idea about the formation and extending of relationship and interdependence of countries in various fields", answer: "Globalization", category: "Cultural Studies" },
            { question: "Basis for the internationalization of capital, international division of labour, and information technologies distribution", answer: "Globalization", category: "Cultural Studies" },
            { question: "Positive self-identification is expressed in the thesis...", answer: "We are unique", category: "Cultural Studies" },
            { question: "Qualities, beliefs, personality traits, appearance, and expressions characterizing a person or group", answer: "Identity (Personal and Collective)", category: "Cultural Studies" },
            { question: "Core levels of identity include...", answer: "Personal and collective", category: "Cultural Studies" },
            { question: "In the early 90s, artists and peoples in Kazakhstan faced the task of...", answer: "Self-determination", category: "Cultural Studies" },
            { question: "Moldakul Narymbetov applied what materials for his installation 'Scarab beetle'?", answer: "Tires", category: "Cultural Studies" },
            { question: "Leading style in modern costume design in Kazakhstan", answer: "Ethnic style", category: "Cultural Studies" },
            { question: "Types of Kazakh culture nowadays include...", answer: "Dominant culture", category: "Cultural Studies" },

            // Internet Technologies & Cloud (Lecture 5) (15)
            { question: "What is the core interaction model of the web?", answer: "Client-Server model: clients request information from a server, and the server responds[cite: 23].", category: "ICT - Internet" },
            { question: "What is the primary role of an Internet Service Provider (ISP)?", answer: "Connects clients to the internet (via fiber optic, DSL, or mobile data) with high uptime and speed[cite: 25].", category: "ICT - Internet" },
            { question: "What is the difference between IPv4 and IPv6?", answer: "IPv4 uses 32-bit dotted-decimal notation (~4.3B addresses); IPv6 uses hexadecimal notation with 128 bits providing 340 undecillion addresses[cite: 33, 34].", category: "ICT - Internet" },
            { question: "What does DNS stand for and what is its function?", answer: "Domain Name System; it maps human-readable domain names to numerical IP addresses[cite: 35].", category: "ICT - Internet" },
            { question: "What are the three main components of a URL?", answer: "Protocol, Domain Name, and Path (subdirectories)[cite: 37].", category: "ICT - Internet" },
            { question: "What is the limitation of the IP protocol?", answer: "IP moves packets from router to router but does not check whether packets are delivered successfully[cite: 49].", category: "ICT - Internet" },
            { question: "What is the role of TCP in TCP/IP?", answer: "Transmission Control Protocol splits data into packets, guarantees delivery, and reassembles them at the recipient[cite: 58].", category: "ICT - Internet" },
            { question: "Describe the TCP three-step handshake.", answer: "SYN -> SYN/ACK -> ACK, establishing an end-to-end virtual connection before data transfer[cite: 52].", category: "ICT - Internet" },
            { question: "What is Cloud Computing?", answer: "Internet-based computing providing shared resources, software, and information on-demand[cite: 61].", category: "ICT - Cloud" },
            { question: "What are the two main components of cloud computing?", answer: "Frontend (client-side interface/browser) and Backend (the cloud servers, databases, and storage)[cite: 63, 64].", category: "ICT - Cloud" },
            { question: "What is Infrastructure as a Service (IaaS)?", answer: "Provides raw physical or virtual hardware, servers, storage, and networking managed by a provider[cite: 52].", category: "ICT - Cloud" },
            { question: "What is Platform as a Service (PaaS)?", answer: "Provides a computing platform and environment for developers to build and deploy web applications[cite: 73].", category: "ICT - Cloud" },
            { question: "What is Software as a Service (SaaS)?", answer: "Applications delivered over the internet and run on servers, eliminating local installation (e.g., Google Drive, Office 365)[cite: 58, 76].", category: "ICT - Cloud" },
            { question: "What are the four cloud deployment models?", answer: "Private cloud, Public cloud, Community cloud, and Hybrid cloud[cite: 64].", category: "ICT - Cloud" },
            { question: "What is Mobile Cloud Computing (MCC)?", answer: "The combination of cloud computing, mobile computing, and wireless networks to deliver cloud services to mobile devices[cite: 91].", category: "ICT - Cloud" },

            // Database Systems (Lecture 6) (15)
            { question: "Define a Database and a DBMS.", answer: "A database is a structured collection of related data and metadata[cite: 106]; a DBMS is software enabling easy creation, access, and modification of databases[cite: 107].", category: "ICT - Databases" },
            { question: "What makes up a Database System environment?", answer: "Hardware, Software (OS and DBMS), People, Procedures and standards, and Data[cite: 110].", category: "ICT - Databases" },
            { question: "What are the main functions of a DBMS?", answer: "Store data/forms/reports, hide relational complexities, enforce data integrity, manage security, and provide backup/recovery[cite: 114].", category: "ICT - Databases" },
            { question: "What are Business Rules in database design?", answer: "Brief, precise, and unambiguous descriptions of operations in an organization based on policies and procedures[cite: 116].", category: "ICT - Databases" },
            { question: "What do the ACID properties stand for in transactions?", answer: "Atomicity, Consistency, Isolation, and Durability - ensuring multi-transactional database health and preventing failure[cite: 122].", category: "ICT - Databases" },
            { question: "What is the Relational Model?", answer: "A model based on first-order predicate logic that stores data in tables (relations) consisting of rows (tuples) and columns (attributes)[cite: 133].", category: "ICT - Databases" },
            { question: "What is a Primary Key (PK)?", answer: "An attribute or set of attributes that uniquely identifies every row in a table and cannot contain NULL values[cite: 137].", category: "ICT - Databases" },
            { question: "What is a Foreign Key (FK)?", answer: "A field in a table whose values match the primary key of a related table, establishing relationships between tables[cite: 137].", category: "ICT - Databases" },
            { question: "What is a Database Schema?", answer: "The skeleton structure representing the logical view of the entire database, defining entities, relationships, and constraints[cite: 138].", category: "ICT - Databases" },
            { question: "What is the difference between physical and logical database schema?", answer: "Physical schema defines actual storage of data in files/indices; logical schema defines logical constraints, tables, and views[cite: 139].", category: "ICT - Databases" },
            { question: "What is an Entity in the ER Model?", answer: "A person, place, thing, or event of interest about which data is collected and stored, represented by a rectangle[cite: 144].", category: "ICT - Databases" },
            { question: "What are the types of attributes in ER diagrams?", answer: "Simple, Composite (tree-like), Multivalued (double ellipse), and Derived (dashed ellipse)[cite: 146, 147, 148, 149].", category: "ICT - Databases" },
            { question: "What are relationship cardinalities?", answer: "Mapping cardinalities defining the number of associations between entities (1:1, 1:N, M:N)[cite: 150, 152, 153, 154].", category: "ICT - Databases" },
            { question: "What is Generalization in ER modeling?", answer: "The process of bringing together a number of entities into one generalized entity based on shared characteristics[cite: 157].", category: "ICT - Databases" },
            { question: "What is Specialization and Inheritance?", answer: "Specialization divides entity groups into subgroups; inheritance allows lower-level entities to inherit attributes of higher-level entities[cite: 158, 159].", category: "ICT - Databases" },

            // Cybercrime & Cybersecurity (Lecture 7) (15)
            { question: "Define Cybercrime and Cybersecurity.", answer: "Cybercrime is criminal activity carried out using computers/internet[cite: 166]; cybersecurity is measures taken to protect computers against unauthorized access or attack[cite: 167].", category: "ICT - Security" },
            { question: "What are the four categories of computer crimes?", answer: "1. Computer as a Tool, 2. Computer as a Target, 3. Selling Illicit Goods, 4. Offensive Content or Harassment[cite: 175].", category: "ICT - Security" },
            { question: "What is the difference between 'Computer as a Tool' and 'Computer as a Target'?", answer: "Tool means using a computer to target an individual (phishing, fraud); Target means attacking a computer system directly (malware, hacking)[cite: 176, 177].", category: "ICT - Security" },
            { question: "What is the primary goal of cybersecurity?", answer: "To make your system as difficult a target as possible so cybercriminals are dissuaded and move on[cite: 185].", category: "ICT - Security" },
            { question: "Who are considered easy targets in cybersecurity?", answer: "Users who use weak/reused passwords, respond to spam, click email links, visit shady sites, and run pirated software[cite: 189].", category: "ICT - Security" },
            { question: "Why is pirated software dangerous?", answer: "Crackers embed malware and backdoors to control computers, mine crypto, or launch attacks (approx. 2/3 of pirated PCs are contaminated)[cite: 194, 195].", category: "ICT - Security" },
            { question: "Why are software updates important?", answer: "They patch newly discovered vulnerabilities and exploits before script kiddies and criminals can utilize them[cite: 199].", category: "ICT - Security" },
            { question: "What is the difference between a password and a passphrase?", answer: "Passwords are complex random strings; passphrases use multiple memorable words or positive messages (e.g., 'I want 2 smile more :)')[cite: 200, 201].", category: "ICT - Security" },
            { question: "What is Malware?", answer: "Malicious software that infects and damages a computer system without the owner's knowledge or permission[cite: 206].", category: "ICT - Security" },
            { question: "What are the functions of different malware types?", answer: "Worms self-replicate; viruses crash systems; Trojan horses steal data and provide backdoors; spyware/keyloggers collect user data[cite: 209].", category: "ICT - Security" },
            { question: "What is Ransomware?", answer: "Malware that encrypts an entire computer and demands payment (usually in Bitcoin) for file decryption[cite: 210].", category: "ICT - Security" },
            { question: "What is a Data Leak?", answer: "The release of secure information to an untrusted environment, such as usernames and passwords leaked from hacked websites[cite: 213].", category: "ICT - Security" },
            { question: "How can you check if your email has been compromised?", answer: "By using breach-checking tools like 'Have I Been Pwned?'[cite: 216].", category: "ICT - Security" },
            { question: "What is Phishing?", answer: "A form of unsolicited email where cybercriminals trick users into revealing account credentials via malicious links or fake pages[cite: 219].", category: "ICT - Security" },
            { question: "What are the security risks of open WiFi networks?", answer: "Unencrypted data transmitted over public WiFi can be easily intercepted by attackers to steal login credentials and passwords[cite: 223].", category: "ICT - Security" }
        ];

        let currentIndex = 0;
        let currentCategory = 'All';
        let filteredCards = [...flashcards];

        const flashcardEl = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const frontCategory = document.getElementById('front-category');
        const backCategory = document.getElementById('back-category');
        const frontNumber = document.getElementById('front-number');
        const backNumber = document.getElementById('back-number');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateCard() {
            if (filteredCards.length === 0) {
                frontText.innerText = "No flashcards in this category.";
                backText.innerText = "No flashcards in this category.";
                return;
            }
            const card = filteredCards[currentIndex];
            frontText.innerText = card.question;
            backText.innerText = card.answer;
            frontCategory.innerText = card.category;
            backCategory.innerText = card.category;
            
            const numStr = `${currentIndex + 1} / ${filteredCards.length}`;
            frontNumber.innerText = numStr;
            backNumber.innerText = numStr;
            counterEl.innerText = numStr;

            flashcardEl.classList.remove('flipped');
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === filteredCards.length - 1;
        }

        function flipCard() {
            flashcardEl.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < filteredCards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function filterCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            
            // Update active button styling
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(category) || (category === 'All' && btn.innerText.includes('All'))) {
                    btn.classList.add('active');
                }
            });

            if (category === 'All') {
                filteredCards = [...flashcards];
            } else {
                filteredCards = flashcards.filter(c => c.category === category);
            }
            updateCard();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                flipCard();
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        // Initialize
        updateCard();
    </script>
</body>
</html>
